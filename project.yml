name: GrowASong
options:
  bundleIdPrefix: com.anshsaini.growasong
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: DA7QAC5V92
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  GrowCore:
    path: Packages/GrowCore
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: 3.32.3
  swift-huggingface:
    url: https://github.com/huggingface/swift-huggingface
    from: 0.9.0
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.0
targets:
  GrowASong:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - package: GrowCore
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: mlx-swift-lm
        product: MLXHuggingFace
      - package: mlx-swift-lm
        product: MLXGuidedGeneration
      - package: swift-huggingface
        product: HuggingFace
      - package: swift-transformers
        product: Tokenizers
    entitlements:
      path: App/GrowASong.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.kernel.increased-memory-limit: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Grow a Song
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio, location]
        NSLocationWhenInUseUsageDescription: Grow a Song checks whether you are outside in daylight. Your location never leaves your phone.
        NSMotionUsageDescription: Grow a Song uses walking and running activity to count your minutes outside.
        NSMicrophoneUsageDescription: Grow a Song records a 10 second sound of where you are and mixes it into your song.
        NSHealthShareUsageDescription: Grow a Song reads time in daylight measured by your Apple Watch.
        NSHealthUpdateUsageDescription: Grow a Song does not write Health data from the phone.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anshsaini.growasong
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  GrowASongWatch:
    type: application
    platform: watchOS
    sources:
      - Watch
    dependencies:
      - package: GrowCore
    entitlements:
      path: Watch/GrowASongWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Grow a Song
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.anshsaini.growasong
        WKBackgroundModes: [workout-processing]
        NSHealthShareUsageDescription: Grow a Song reads heart rate during your run.
        NSHealthUpdateUsageDescription: Grow a Song saves your run as a workout.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anshsaini.growasong.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  ComposerEval:
    type: tool
    platform: macOS
    sources:
      - Tools/ComposerEval
      - Shared
    dependencies:
      - package: GrowCore
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: mlx-swift-lm
        product: MLXHuggingFace
      - package: mlx-swift-lm
        product: MLXGuidedGeneration
      - package: swift-huggingface
        product: HuggingFace
      - package: swift-transformers
        product: Tokenizers
    settings:
      base:
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
